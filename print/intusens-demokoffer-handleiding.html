<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IntuSens Demokoffer · handleiding (print)</title>
<style>
  @page{size:A4;margin:16mm 16mm 18mm}
  :root{--ink:#000;--grey:#494A48;--line:#DDDDDD;--blue:#072D78;--warn:#C80A46;--surface:#F6F6F6}
  *{box-sizing:border-box}
  body{font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--ink);margin:0;line-height:1.45;font-size:11pt;background:#fff}
  .page{max-width:190mm;margin:0 auto;padding:12mm 0}
  h1{font-size:26pt;margin:0 0 4pt;letter-spacing:-.02em}
  h2{font-size:15pt;margin:0 0 8pt;padding-top:6pt;border-top:2px solid var(--ink)}
  h3{font-size:11.5pt;margin:10pt 0 4pt}
  p{margin:0 0 6pt}
  .eyebrow{font-size:8.5pt;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);font-weight:600}
  .brand{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:8pt;margin-bottom:14pt}
  .brand img{height:16pt}
  .qrbox{display:flex;gap:10pt;align-items:center;border:1px solid var(--line);padding:6pt 8pt;margin:8pt 0 14pt}
  .qrbox img{width:64pt;height:64pt}
  .qrbox b{display:block}
  .qrbox span{font-size:9pt;color:var(--grey)}
  .brand span{font-size:9pt;color:var(--grey)}
  section{break-inside:avoid;margin-bottom:16pt}
  .steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6pt}
  .steps div{border:1px solid var(--line);padding:8pt;font-size:9.5pt}
  .steps i{font-style:normal;font-weight:700;color:var(--blue);font-size:14pt;display:block}
  table{border-collapse:collapse;width:100%;font-size:9pt}
  th,td{text-align:left;padding:4pt 5pt;border-bottom:1px solid var(--line);vertical-align:top}
  th{background:var(--surface);font-size:8pt;text-transform:uppercase;letter-spacing:.06em}
  .mono{font-family:Consolas,Menlo,monospace;font-size:8.5pt}
  .na{color:var(--warn)}
  .note{border-left:3px solid var(--blue);padding:6pt 8pt;background:#E9F2FB;font-size:9.5pt;margin:8pt 0}
  .note.warn{border-color:var(--warn);background:#FBECF1}
  ul{margin:0 0 6pt;padding-left:16pt}
  li{margin:1pt 0}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12pt}
  .small{font-size:9pt;color:var(--grey)}
  .imgrow{display:grid;grid-template-columns:repeat(5,1fr);gap:6pt}
  .imgrow div{border:1px solid var(--line);padding:4pt;text-align:center;font-size:8.5pt}
  .imgrow img{width:100%;height:60pt;object-fit:contain;display:block;margin-bottom:3pt}
  .fotos{display:grid;grid-template-columns:1fr 1fr;gap:8pt}
  .fotos figure{margin:0}
  .fotos img{width:100%;border:1px solid var(--line)}
  .fotos figcaption{font-size:8.5pt;color:var(--grey);margin-top:2pt}
  .print-btn{position:fixed;top:12px;right:12px;padding:8px 14px;background:#000;color:#fff;border:0;border-radius:4px;font:inherit;cursor:pointer}
  @media print{.print-btn{display:none}.page{padding:0}}
  .footer{font-size:8pt;color:var(--grey);border-top:1px solid var(--line);padding-top:6pt;margin-top:14pt}
</style>
</head>
<body>
<button class="print-btn" onclick="window.print()">Afdrukken / PDF</button>
<div class="page" id="page"><p>Data laden…</p></div>
<script src="../src/data.js"></script>
<script>
(function(){
  var D=window.INTUSENS_DATA,P=D.producten,K=D.koffer,B=D.bediening,DEMO=D.demo;
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  var h='';
  h+='<div class="brand"><img src="../assets/brand/trilux-logo-kleur-zwart.png" alt="TRILUX"><span>TRILUX IntuSens Demokoffer · snelle handleiding</span></div>';
  h+='<div class="eyebrow">TRILUX IntuSens Demokoffer</div><h1>Demokoffer — snelle handleiding</h1>';
  h+='<div class="qrbox"><img src="../assets/qr/intusens-demokoffer.png" alt="QR-code naar de online versie"><div><b>Online versie</b><span>Scan de QR-code of ga naar intusens-demokoffer.nl. Na het eerste bezoek werkt de site ook zonder internet.</span></div></div>';
  var ss=K.snelstart_sales;
  h+='<section><h2>1. Demokoffer in 30 seconden</h2><div class="steps" style="grid-template-columns:repeat(3,1fr)">'+ss.stappen.map(function(s,i){return '<div><i>'+(i+1)+'</i><b>'+esc(s[0])+'</b><br>'+esc(s[1])+'</div>';}).join('')+'</div><p class="small" style="margin-top:6pt">'+esc(ss.noot)+'</p></section>';
  h+='<section><h2>2. Wat zit waar?</h2><div class="fotos"><figure><img src="../'+esc(K.stages[0].foto)+'" alt=""><figcaption>Deksel: alle bouwvormen</figcaption></figure><figure><img src="../'+esc(K.stages[1].foto)+'" alt=""><figcaption>Onderzijde: links Switch, rechts DALI-2 Broadcast</figcaption></figure></div></section>';
  h+='<section><h2>3. Wat is IntuSens?</h2><p>'+esc(P.familie.claim)+'</p><ul>'+P.familie.kern.map(function(k){return '<li>'+esc(k.tekst.replace(/\s*\([^)]*\)\s*$/,''))+'</li>';}).join('')+'</ul></section>';
  h+='<section><h2>4. De vier regelvarianten</h2><table><tr><th>Variant</th><th>Werking</th></tr>'+P.regelvarianten.map(function(r){return '<tr><td><b>'+esc(r.naam)+'</b></td><td>'+esc(r.kop)+'<ul>'+r.uitleg.map(function(u){return '<li>'+esc(u)+'</li>';}).join('')+'</ul></td></tr>';}).join('')+'</table></section>';
  var V=P.vergelijking;
  h+='<section><h2>5. Eén familie, vijf montagevormen</h2><table><tr><th></th>'+V.kolommen.map(function(id){var f=P.bouwvormen.filter(function(b){return b.id===id;})[0];return '<th>'+esc(f.naam.replace('IntuSens ',''))+'</th>';}).join('')+'</tr>'+V.rijen.map(function(r){return '<tr><td><b>'+esc(r[0])+'</b></td>'+r.slice(1).map(function(v){return '<td>'+esc(v)+'</td>';}).join('')+'</tr>';}).join('')+'</table></section>';
  h+='<section><h2>6. Inhoud van de koffer</h2><table><tr><th>Onderdeel</th><th>Uitvoering</th><th>Typecode</th><th>TOC</th><th>TK</th></tr>'+P.producten.map(function(p){var a=p.sales.artikel||{};return '<tr><td><b>'+esc(p.kort)+'</b>'+(p.kofferrol==='actief'?' <span class="small">(werkend)</span>':'')+'</td><td>'+esc(p.sales.sub)+'</td><td class="mono">'+esc(a.typecode||'—')+'</td><td class="mono">'+esc(a.toc||'—')+'</td><td class="mono">'+esc(a.tk||'—')+'</td></tr>';}).join('')+'</table></section>';
  var bs=B.sales;
  h+='<section><h2>7. Bediening Switch en DALI-2 Broadcast</h2><p>'+esc(bs.switch.sub)+'</p><div class="two"><div><h3>Op de sensor</h3><ol style="padding-left:16pt">'+bs.switch.aanwijzingen.map(function(a){return '<li><b>'+esc(a[0])+'</b> — '+esc(a[1])+'</li>';}).join('')+'</ol></div><div><h3>In drie stappen</h3><ol style="padding-left:16pt">'+bs.switch.stappen.map(function(a){return '<li><b>'+esc(a[0])+'</b> — '+esc(a[1])+'</li>';}).join('')+'</ol></div></div><h3>DALI-2 Broadcast</h3><p>'+bs.broadcast.keten.join(' → ')+'</p></section>';
  h+='<section><h2>8. De demo in acht stappen</h2><table><tr><th>#</th><th>Onderwerp</th><th>In het kort</th></tr>'+DEMO.schermen.map(function(s){return '<tr><td>'+s.n+'</td><td><b>'+esc(s.titel)+'</b></td><td>'+esc(s.boodschap)+'</td></tr>';}).join('')+'</table></section>';
  h+='<div class="footer">TRILUX IntuSens Demokoffer · intusens-demokoffer.nl</div>';
  document.getElementById('page').innerHTML=h;
})();
</script>
</body>
</html>
